<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无纸化维护中心 · 双端设计预览</title><link rel="icon" href="app-icon.png"><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172a42;background:#eaf0f5}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}header{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #dce4ed}.brand{display:flex;gap:12px;align-items:center}.brand img{width:35px;border-radius:10px}.brand strong{font-size:15px}.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:#8a97aa;margin-top:4px}.switch{display:flex;padding:4px;background:#f0f3f7;border-radius:10px;gap:3px}.switch button{border:0;background:none;color:#6b7788;padding:9px 17px;border-radius:7px;font-size:12px}.switch button.active{background:white;color:#1c57d7;box-shadow:0 2px 6px #15294310}.intro{display:flex;justify-content:space-between;align-items:flex-end;padding:27px 34px 23px;gap:24px}.intro h1{font-size:25px;letter-spacing:-.7px;margin:0 0 9px}.intro p{font-size:12px;color:#738298;margin:0;line-height:1.7}.scenes{display:flex;gap:6px;flex-wrap:wrap}.scenes button{border:1px solid #cbd6e2;border-radius:7px;background:#f8fafc;padding:9px 13px;font-size:12px;color:#41556f}.scenes button:hover{border-color:#3679ec;color:#2869e8}.scene-note{font-size:10px;color:#8c98a9;display:block;margin-top:9px;text-align:right}.stage{padding:0 32px 32px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}.label{font-size:10px;color:#71839b;letter-spacing:1.1px;margin:0 0 11px;display:flex;justify-content:space-between}.label a{color:#607995;text-decoration:none;letter-spacing:0}.desktop-box{overflow:hidden;border-radius:13px;box-shadow:0 18px 65px #263c5520;border:1px solid #c6d2df;background:#fff}.desktop-device{width:1280px;height:830px;transform-origin:top left}.windowbar{height:30px;background:#f8fafc;border-bottom:1px solid #e8edf2;display:flex;align-items:center;gap:7px;padding:0 14px}.windowbar i{width:8px;height:8px;border-radius:50%;background:#fb655c}.windowbar i:nth-child(2){background:#f6be4f}.windowbar i:nth-child(3){background:#35c568}.windowbar span{font-size:10px;color:#93a0ae;position:absolute;left:45%}iframe{width:100%;border:0;display:block;background:#f5f8fc}.desktop-device iframe{height:800px}.phonebox{width:330px;height:702px;padding:7px;background:#162438;border-radius:43px;box-shadow:0 18px 50px #142e4930;position:relative}.phonebox iframe{width:390px;height:844px;transform:scale(.81025);transform-origin:top left;border-radius:43px}.phone-inner{overflow:hidden;width:316px;height:684px;border-radius:36px}.phonebox:after{content:"";position:absolute;width:95px;height:5px;background:#14243b;bottom:15px;left:117px;border-radius:10px;pointer-events:none}.foot{font-size:11px;line-height:1.8;color:#7d8a9b;padding:16px 2px}.foot b{font-weight:500;color:#536a84}body[data-mode=desktop] .phone-preview{display:none}body[data-mode=desktop] .stage{display:block}body[data-mode=desktop] .desktop-device{width:100%;height:calc(100vh - 214px);transform:none!important}body[data-mode=desktop] .desktop-device iframe{height:calc(100% - 30px)}body[data-mode=desktop] .desktop-box{height:auto!important}body[data-mode=desktop] .foot{display:none}body[data-mode=mobile] .desktop-preview{display:none}body[data-mode=mobile] .stage{display:flex;justify-content:center}body[data-mode=mobile] .phonebox{width:390px;height:838px;padding:7px}body[data-mode=mobile] .phone-inner{width:376px;height:820px}body[data-mode=mobile] .phonebox iframe{transform:scale(.9641)}body[data-mode=mobile] .phonebox:after{left:148px}@media(max-width:900px){header{padding:0 16px}.brand small{display:none}.switch button{padding:9px}.intro{padding:20px 18px;align-items:start;flex-direction:column;gap:16px}.intro h1{font-size:22px}.stage{padding:0 16px 25px;grid-template-columns:1fr}.phone-preview{margin:0 auto}.scene-note{display:none}.foot{margin-bottom:12px}}@media(prefers-reduced-motion:no-preference){button{transition:.2s} .stage{animation:enter .5s ease both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body data-mode="compare"><header><div class="brand"><img src="app-icon.png" alt="应用图标"><div><strong>无纸化维护中心</strong><small>DESIGN PREVIEW / 02</small></div></div><nav class="switch" aria-label="预览端"><button class="active" data-mode="compare">双端对照</button><button data-mode="desktop">桌面端</button><button data-mode="mobile">手机端</button></nav></header><section class="intro"><div><h1>让查询更轻，让单据更清楚。</h1><p>完整字段 · 连续阅读 · 一次查询，所有关联资料触手可及</p></div><div><div class="scenes"><button data-scene="search">① 体验搜索</button><button data-scene="details">② 单据详情</button><button data-scene="pdf">③ PDF 阅读</button><button data-scene="message">④ 报文专注</button></div><span class="scene-note">可点击、输入、筛选和下载 · 本地演示数据，不连接业务接口</span></div></section><main class="stage"><section class="desktop-preview"><div class="label"><span>DESKTOP / 阅读与核对并行</span><a href="workspace.html" target="_blank">独立打开 ↗</a></div><div class="desktop-box"><div class="desktop-device"><div class="windowbar"><i></i><i></i><i></i><span>无纸化维护中心</span></div><iframe src="workspace.html?surface=desktop" title="桌面高保真原型"></iframe></div></div><div class="foot"><b>桌面：</b>左侧定位工单，中间查看完整信息，右侧并排阅读 PDF。拖动分隔线调整阅读空间。</div></section><section class="phone-preview"><div class="label"><span>MOBILE / 为一只手重新安排</span><a href="workspace.html?surface=phone" target="_blank">独立打开 ↗</a></div><div class="phonebox"><div class="phone-inner"><iframe src="workspace.html?surface=phone" title="手机高保真原型"></iframe></div></div><div class="foot"><b>手机：</b>搜索独立展开，结果先选工单。单据内容完整滚动，PDF 随时进入沉浸阅读。</div></section></main><script>
// 预览壳只负责尺寸和场景广播，两个端的业务交互状态相互独立。
const box=document.querySelector('.desktop-box'),device=document.querySelector('.desktop-device');
function fit(){if(document.body.dataset.mode==='desktop')return;const scale=box.clientWidth/1280;device.style.transform=`scale(${scale})`;box.style.height=`${830*scale}px`}
new ResizeObserver(fit).observe(box);window.addEventListener('load',fit);
document.querySelectorAll('[data-mode]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.onclick=()=>{document.body.dataset.mode=b.dataset.mode;document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('active',x===b));fit()}});
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'prototype-scene',scene:b.dataset.scene},'*')));
</script></body></html>
